<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
    <linearGradient id="lacq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f2c28"/><stop offset="1" stop-color="#161412"/></linearGradient>
    <filter id="s10" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">PODIUM MODULAIRE — DÉTAIL DE PRINCIPE</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">PRÉSENTOIR ÉVOLUTIF &amp; RENOUVELABLE</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">cotes en m · détail ≈ 1:20</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- ===== A · ÉLÉVATION COTÉE ===== -->
  <text x="40" y="104" fill="#1A1A1A" font-size="12" font-weight="600">A · ÉLÉVATION TYPE</text>
  <line x1="40" y1="110" x2="300" y2="110" stroke="#9C7A4D" stroke-width="1"/>
  <!-- backing panel -->
  <rect x="90" y="130" width="150" height="220" fill="#1f1d1a"/>
  <rect x="90" y="130" width="150" height="16" fill="#9C7A4D"/>  <!-- valance light -->
  <g stroke="#9C7A4D" stroke-width="1.5"><line x1="100" y1="150" x2="100" y2="350"/><line x1="230" y1="150" x2="230" y2="350"/></g> <!-- tracks -->
  <!-- product on panel -->
  <rect x="130" y="180" width="40" height="90" fill="#cdbfa6"/>
  <!-- podium plinth -->
  <rect x="80" y="350" width="170" height="46" rx="2" fill="url(#lacq)" filter="url(#s10)"/>
  <rect x="86" y="392" width="158" height="6" fill="#0d0c0b"/> <!-- recessed socle -->
  <rect x="120" y="338" width="90" height="12" fill="#3a352f"/> <!-- removable display tray -->
  <!-- floor -->
  <rect x="60" y="398" width="220" height="6" fill="#d9d2c6"/><line x1="60" y1="398" x2="280" y2="398" stroke="#1A1A1A" stroke-width="1"/>
  <!-- dims -->
  <g stroke="#777" stroke-width="0.7" fill="#555" font-size="8.5" text-anchor="middle">
    <line x1="80" y1="416" x2="250" y2="416" marker-start="url(#dd)" marker-end="url(#dd)"/><text x="165" y="426">1.20</text>
    <line x1="266" y1="350" x2="266" y2="398" marker-start="url(#dd)" marker-end="url(#dd)"/><text transform="translate(272,374) rotate(-90)">0.45</text>
    <line x1="266" y1="130" x2="266" y2="350" marker-start="url(#dd)" marker-end="url(#dd)"/><text transform="translate(272,240) rotate(-90)">2.20</text>
  </g>
  <text x="165" y="372" fill="#EDE9E3" font-size="7.5" text-anchor="middle">plateau démontable</text>

  <!-- ===== B · COUPE CONSTRUCTIVE ===== -->
  <text x="330" y="104" fill="#1A1A1A" font-size="12" font-weight="600">B · COUPE — CONSTRUCTION</text>
  <line x1="330" y1="110" x2="600" y2="110" stroke="#9C7A4D" stroke-width="1"/>
  <g transform="translate(360,150)">
    <rect x="0" y="200" width="180" height="50" rx="2" fill="url(#lacq)"/>
    <rect x="8" y="208" width="164" height="34" fill="none" stroke="#5a5650" stroke-width="1"/>
    <text x="90" y="230" fill="#9C7A4D" font-size="8" text-anchor="middle">caisson MDF laqué mat</text>
    <rect x="0" y="190" width="180" height="10" fill="#3a352f"/><text x="200" y="198" fill="#777" font-size="8">plateau amovible</text>
    <rect x="20" y="250" width="140" height="6" fill="#0d0c0b"/><text x="200" y="256" fill="#777" font-size="8">socle en retrait (effet flottant)</text>
    <rect x="0" y="184" width="180" height="6" fill="#ffd98a" opacity="0.6"/><text x="200" y="180" fill="#9C7A4D" font-size="8">LED léchage plateau (option)</text>
    <line x1="0" y1="120" x2="0" y2="184" stroke="#9C7A4D" stroke-width="2"/><text x="-6" y="120" fill="#9C7A4D" font-size="8" text-anchor="end">panneau dossier</text>
    <g stroke="#777" stroke-width="0.7" fill="#555" font-size="8" text-anchor="middle"><line x1="200" y1="190" x2="200" y2="250" marker-start="url(#dd)" marker-end="url(#dd)"/><text transform="translate(218,220) rotate(-90)">0.45</text></g>
  </g>

  <!-- ===== C · VARIANTES PAR UNIVERS ===== -->
  <text x="40" y="448" fill="#1A1A1A" font-size="12" font-weight="600">C · VARIANTES DE PRÉSENTOIR (même socle)</text>
  <line x1="40" y1="454" x2="600" y2="454" stroke="#9C7A4D" stroke-width="1"/>
  <g>
    <rect x="40" y="468" width="130" height="120" fill="#201e1b" rx="3"/>
    <rect x="60" y="500" width="40" height="6" fill="#8a6a45" transform="rotate(-18 80 503)"/><rect x="110" y="500" width="40" height="6" fill="#8f8a82" transform="rotate(-18 130 503)"/>
    <text x="105" y="578" fill="#9C7A4D" font-size="8.5" text-anchor="middle">SOLS — stands inclinés</text>

    <rect x="184" y="468" width="130" height="120" fill="#201e1b" rx="3"/>
    <rect x="230" y="486" width="12" height="78" fill="#e3ddd0"/><rect x="252" y="496" width="12" height="68" fill="#e3ddd0"/><rect x="220" y="486" width="60" height="8" fill="#e3ddd0"/>
    <text x="249" y="578" fill="#9C7A4D" font-size="8.5" text-anchor="middle">MOULURES — bras</text>

    <rect x="328" y="468" width="130" height="120" fill="#201e1b" rx="3"/>
    <rect x="360" y="492" width="66" height="56" fill="none" stroke="#9C7A4D" stroke-width="2"/><rect x="368" y="500" width="50" height="40" fill="#7d6f56"/>
    <text x="393" y="578" fill="#9C7A4D" font-size="8.5" text-anchor="middle">MOSAÏQUES — cadres</text>

    <rect x="472" y="468" width="130" height="120" fill="#201e1b" rx="3"/>
    <path d="M512,486 h22 v66 q-11,5 -22,0 z" fill="#cdbfa6"/><path d="M540,486 h22 v66 q-11,5 -22,0 z" fill="#b9a98a"/>
    <text x="537" y="578" fill="#9C7A4D" font-size="8.5" text-anchor="middle">PAP. PEINTS — barres + lest</text>
  </g>

  <!-- ===== SPECS ===== -->
  <rect x="624" y="96" width="332" height="492" fill="#1A1A1A" rx="4"/>
  <text x="642" y="120" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">SPÉCIFICATIONS</text>
  <line x1="642" y1="128" x2="938" y2="128" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="10" fill="#EDE9E3">
    <text x="642" y="148">Empreinte socle</text><text x="938" y="148" text-anchor="end" fill="#9C7A4D">1.20 × 0.80 m</text>
    <text x="642" y="168">Hauteur plateau</text><text x="938" y="168" text-anchor="end" fill="#9C7A4D">0.45 m</text>
    <text x="642" y="188">Panneau dossier</text><text x="938" y="188" text-anchor="end" fill="#9C7A4D">H 2.20 m</text>
    <text x="642" y="208">Caisson</text><text x="938" y="208" text-anchor="end" fill="#9C7A4D">MDF laqué mat</text>
    <text x="642" y="228">Plateau</text><text x="938" y="228" text-anchor="end" fill="#9C7A4D">amovible / interchangeable</text>
    <text x="642" y="248">Socle</text><text x="938" y="248" text-anchor="end" fill="#9C7A4D">en retrait (effet flottant)</text>
    <text x="642" y="268">Accroche dossier</text><text x="938" y="268" text-anchor="end" fill="#9C7A4D">rail crémaillère bronze</text>
    <text x="642" y="288">Éclairage</text><text x="938" y="288" text-anchor="end" fill="#9C7A4D">spot rail + LED option</text>
  </g>
  <text x="642" y="318" fill="#9C7A4D" font-size="11" letter-spacing="1" font-weight="600">MODULARITÉ</text>
  <line x1="642" y1="326" x2="938" y2="326" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="9.5" fill="#EDE9E3">
    <text x="642" y="346">▸ 1 socle commun → 4 kits de présentation</text>
    <text x="642" y="365">▸ Changement d'univers = changement de</text>
    <text x="654" y="379" fill="#A9A399" font-size="8.5">plateau + dossier, sans toucher au socle</text>
    <text x="642" y="398">▸ Renouvellement par collection / saison</text>
    <text x="642" y="417">▸ Déplaçable (patins) pour réagencer le magasin</text>
    <text x="642" y="436">▸ Plaquette bronze réf. + QR → catalogue</text>
  </g>
  <text x="642" y="466" fill="#9C7A4D" font-size="11" letter-spacing="1" font-weight="600">ÉCONOMIE</text>
  <line x1="642" y1="474" x2="938" y2="474" stroke="#9C7A4D" stroke-width="1"/>
  <text x="642" y="494" fill="#A9A399" font-size="8.8">Investissement concentré sur un socle</text>
  <text x="642" y="507" fill="#A9A399" font-size="8.8">durable ; les kits (peu coûteux) tournent.</text>
  <text x="642" y="520" fill="#A9A399" font-size="8.8">Vitrine toujours « neuve » à budget maîtrisé.</text>
  <text x="642" y="546" fill="#EDE9E3" font-size="9">Cible : 4 podiums + 2 podiums d'appoint</text>
  <text x="642" y="560" fill="#EDE9E3" font-size="9">pour temps forts / nouveautés.</text>

  <text x="28" y="636" fill="#999" font-size="9">DARTANK · Maison Drapée — Magasin 200 m² — Détail podium modulaire — itération 2 (détail)</text>
</svg>
