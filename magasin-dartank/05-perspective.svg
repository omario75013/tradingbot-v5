<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pfloor" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d8d0c2"/><stop offset="1" stop-color="#bdb4a4"/></linearGradient>
    <linearGradient id="pceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e0d0b"/><stop offset="1" stop-color="#1b1916"/></linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.2" r="0.9"><stop offset="0" stop-color="#ffe9c0" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe9c0" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm2" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffeccb" stop-opacity="0.45"/><stop offset="1" stop-color="#ffeccb" stop-opacity="0"/></radialGradient>
    <pattern id="ppaper" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#3a3833"/><path d="M11,3 q6,8 0,16 q-6,-8 0,-16" fill="none" stroke="#9C7A4D" stroke-width="0.9" opacity="0.6"/></pattern>
    <pattern id="pmosaic" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#5f574a"/><rect x="0.7" y="0.7" width="7.6" height="7.6" fill="#7d6f56"/></pattern>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">MAGASIN — VUE PERSPECTIVE</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">DEPUIS L'ENTRÉE VERS LE MUR SIGNATURE</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">podiums &amp; room sets sous éclairage scénographique</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- shell -->
  <polygon points="60,86 920,86 600,250 380,250" fill="url(#pceil)"/>
  <clipPath id="floorClip"><polygon points="60,600 920,600 600,410 380,410"/></clipPath>
  <polygon points="60,600 920,600 600,410 380,410" fill="url(#pfloor)"/>
  <g clip-path="url(#floorClip)" stroke="#a89e8d" stroke-width="0.8" opacity="0.5">
    <line x1="160" y1="600" x2="490" y2="330"/><line x1="320" y1="600" x2="490" y2="330"/><line x1="660" y1="600" x2="490" y2="330"/><line x1="820" y1="600" x2="490" y2="330"/><line x1="120" y1="520" x2="860" y2="520"/><line x1="250" y1="455" x2="730" y2="455"/>
  </g>

  <!-- left wall : matériauthèque -->
  <polygon points="60,86 60,600 380,410 380,250" fill="#1f1d1a"/>
  <polygon points="60,86 380,250 380,264 60,150" fill="#141312"/><line x1="60" y1="150" x2="380" y2="264" stroke="#9C7A4D" stroke-width="2"/>
  <text x="120" y="138" fill="#9C7A4D" font-size="9" letter-spacing="3" transform="rotate(13 120 138)">DARTANK · MATÉRIAUTHÈQUE</text>
  <polygon points="60,156 130.4,179.8 130.4,429.7 60,448" fill="#8a6a45"/><polygon points="130.4,179.8 194.4,201.4 194.4,413.1 130.4,429.7" fill="#8f8a82"/><polygon points="194.4,201.4 252,220.8 252,398.2 194.4,413.1" fill="url(#pmosaic)"/><polygon points="252,220.8 303.2,238.1 303.2,384.9 252,398.2" fill="#b9a98a"/><polygon points="303.2,238.1 341.6,251 341.6,375 303.2,384.9" fill="#6b6155"/><polygon points="341.6,251 380,264 380,365 341.6,375" fill="#5f574a"/>
  <g stroke="#9C7A4D" stroke-width="1.4"><line x1="130.4" y1="179.8" x2="130.4" y2="429.7"/><line x1="194.4" y1="201.4" x2="194.4" y2="413.1"/><line x1="252" y1="220.8" x2="252" y2="398.2"/><line x1="303.2" y1="238.1" x2="303.2" y2="384.9"/></g>
  <line x1="60" y1="448" x2="380" y2="365" stroke="#9C7A4D" stroke-width="3"/><polygon points="60,448 380,365 380,410 60,600" fill="#232220"/>
  <polygon points="60,156 200,200 200,420 60,460" fill="url(#warm)" opacity="0.8"/>

