  <polygon points="920,86 600,250 600,264 920,150" fill="#141312"/><line x1="920" y1="150" x2="600" y2="264" stroke="#9C7A4D" stroke-width="2"/>
  <polygon points="894.4,164.6 792,199.2 792,414.8 894.4,441.4" fill="url(#ppaper)"/><polygon points="894.4,164.6 792,199.2 792,414.8 894.4,441.4" fill="none" stroke="#9C7A4D" stroke-width="3"/><circle cx="845" cy="290" r="26" fill="#2b2926" stroke="#9C7A4D" stroke-width="2"/>
  <polygon points="760,210 670.4,240.2 670.4,383.3 760,406.5" fill="#bcb5a7"/><polygon points="760,210 670.4,240.2 670.4,383.3 760,406.5" fill="none" stroke="#9C7A4D" stroke-width="3"/><line x1="690" y1="246" x2="690" y2="378" stroke="#e3ddd0" stroke-width="6"/><line x1="745" y1="218" x2="745" y2="402" stroke="#e3ddd0" stroke-width="6"/>
  <polygon points="920,156 800,196 800,430 920,470" fill="url(#warm)" opacity="0.6"/>

  <!-- back wall : signature + accueil -->
  <polygon points="380,250 600,250 600,410 380,410" fill="#1A1A1A"/>
  <ellipse cx="490" cy="300" rx="90" ry="55" fill="url(#warm)" opacity="0.5"/>
  <g transform="translate(470,262) scale(0.42)"><path d="M6,72 L6,30 Q6,6 30,6 Q54,6 54,30 L54,72" fill="none" stroke="#caa46a" stroke-width="5"/><rect x="25" y="2" width="10" height="13" fill="#caa46a"/><rect x="2" y="71" width="56" height="3" fill="#caa46a"/></g>
  <text x="490" y="330" fill="#f3d79e" font-size="16" letter-spacing="6" text-anchor="middle" font-weight="600">DARTANK</text>
  <text x="490" y="346" fill="#9C7A4D" font-size="6" letter-spacing="3" text-anchor="middle">DÉCORATION ARCHITECTURALE</text>
  <polygon points="392,372 588,372 600,410 380,410" fill="#232220"/><line x1="392" y1="372" x2="588" y2="372" stroke="#9C7A4D" stroke-width="1.5"/>
  <text x="490" y="396" fill="#6b6155" font-size="7" text-anchor="middle">ACCUEIL</text>

  <!-- ceiling rails + spots -->
  <g stroke="#9C7A4D" stroke-width="2"><line x1="240" y1="118" x2="448" y2="252"/><line x1="740" y1="118" x2="552" y2="252"/><line x1="490" y1="100" x2="490" y2="250"/></g>
  <g fill="#1A1A1A" stroke="#9C7A4D" stroke-width="1"><circle cx="300" cy="156" r="4"/><circle cx="410" cy="226" r="3"/><circle cx="700" cy="156" r="4"/><circle cx="590" cy="226" r="3"/><circle cx="490" cy="160" r="4"/></g>
  <polygon points="300,158 250,360 360,360" fill="url(#warm2)"/><polygon points="700,158 640,360 760,360" fill="url(#warm2)"/><polygon points="490,162 430,420 550,420" fill="url(#warm2)"/>

  <!-- central podiums -->
  <g>
    <ellipse cx="430" cy="500" rx="60" ry="20" fill="#000" opacity="0.16"/>
    <polygon points="392,470 468,470 486,508 374,508" fill="#0e0d0c" stroke="#9C7A4D" stroke-width="1.2"/>
    <rect x="406" y="430" width="20" height="40" fill="#cdbfa6"/><rect x="432" y="438" width="24" height="32" fill="url(#pmosaic)"/>
    <ellipse cx="430" cy="455" rx="46" ry="26" fill="url(#warm2)" opacity="0.7"/>
  </g>
  <g>
    <ellipse cx="565" cy="470" rx="42" ry="14" fill="#000" opacity="0.14"/>
    <polygon points="540,452 598,452 610,478 528,478" fill="#0e0d0c" stroke="#9C7A4D" stroke-width="1"/>
    <path d="M556,420 h26 v32 q-13,5 -26,0 z" fill="#b9a98a"/>
  </g>

  <!-- caption -->
  <rect x="0" y="610" width="980" height="50" fill="#1A1A1A"/>
  <g fill="#EDE9E3" font-size="10">
    <text x="28" y="630"><tspan fill="#9C7A4D" font-weight="600">Centre</tspan> — Podiums produits par univers, isolés &amp; mis en lumière</text>
    <text x="28" y="648"><tspan fill="#9C7A4D" font-weight="600">Gauche</tspan> — Matériauthèque (reste de la gamme) + tablette de consultation</text>
    <text x="520" y="630"><tspan fill="#9C7A4D" font-weight="600">Droite</tspan> — Room sets : papier peint Maison Drapée, moulures de façade</text>
    <text x="520" y="648"><tspan fill="#9C7A4D" font-weight="600">Fond</tspan> — Mur signature rétroéclairé + accueil ; rails de spots scénographiques</text>
  </g>
  <text x="952" y="606" fill="#999" font-size="9" text-anchor="end">DARTANK · Maison Drapée — Magasin 200 m² — Perspective — itération 1</text>
</svg>
