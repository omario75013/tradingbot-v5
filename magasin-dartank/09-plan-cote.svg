<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">PLAN COTÉ — DIMENSIONS INDICATIVES</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">12.00 × 17.00 m = 204 m²</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">éch. ≈ 1:65 · cotes en m</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- plan (1m=26px, off 110,120) -->
  <rect x="102" y="112" width="328" height="458" fill="#1A1A1A"/>
  <rect x="110" y="120" width="312" height="442" fill="#EAE5DD"/>
  <!-- partitions -->
  <line x1="110" y1="198" x2="422" y2="198" stroke="#1A1A1A" stroke-width="4"/>   <!-- y=3 BOH -->
  <line x1="279" y1="120" x2="279" y2="198" stroke="#1A1A1A" stroke-width="4"/>   <!-- x=6.5 réserve/office -->
  <line x1="110" y1="284" x2="422" y2="284" stroke="#9C7A4D" stroke-width="1.5" stroke-dasharray="5 4"/> <!-- y=6.3 presc limit -->
  <line x1="110" y1="445" x2="422" y2="445" stroke="#9C7A4D" stroke-width="1.5" stroke-dasharray="5 4"/> <!-- y=12.5 showroom/accueil -->
  <line x1="110" y1="530" x2="422" y2="530" stroke="#9C7A4D" stroke-width="1.5" stroke-dasharray="5 4"/> <!-- y=15.8 vitrine -->
  <!-- podium blocks -->
  <g fill="#2b2926"><rect x="162" y="302" width="57" height="52"/><rect x="245" y="302" width="57" height="52"/><rect x="162" y="380" width="57" height="52"/><rect x="245" y="380" width="57" height="52"/></g>
  <!-- zone names -->
  <g fill="#555" font-size="8" text-anchor="middle">
    <text x="190" y="160">back-office</text><text x="350" y="160">réserve / stock</text>
    <text x="180" y="245">prescription</text><text x="345" y="245">comptoir</text>
    <text x="232" y="475" fill="#9C7A4D">accueil + signature</text><text x="350" y="475">café / attente</text>
    <text x="266" y="552" fill="#9C7A4D">vitrine</text>
  </g>

  <!-- ===== HORIZONTAL DIM CHAINS (top) ===== -->
  <g stroke="#777" stroke-width="0.7" fill="#555" font-size="8.5" text-anchor="middle">
    <!-- overall -->
    <line x1="102" y1="96" x2="430" y2="96" marker-start="url(#d)" marker-end="url(#d)"/><text x="266" y="92">12.00</text>
    <!-- réserve/office split at x6.5 (px279) -->
    <line x1="110" y1="108" x2="279" y2="108" marker-start="url(#d)" marker-end="url(#d)"/><text x="194" y="105">6.50</text>
    <line x1="279" y1="108" x2="422" y2="108" marker-start="url(#d)" marker-end="url(#d)"/><text x="350" y="105">5.50</text>
  </g>
  <!-- ===== VERTICAL DIM CHAINS (left = depth bands) ===== -->
  <g stroke="#777" stroke-width="0.7" fill="#555" font-size="8.5" text-anchor="middle">
    <line x1="86" y1="112" x2="86" y2="570" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(80,341) rotate(-90)">17.00</text>
    <line x1="64" y1="120" x2="64" y2="198" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(58,159) rotate(-90)">3.00</text>
    <line x1="64" y1="198" x2="64" y2="284" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(58,241) rotate(-90)">3.30</text>
    <line x1="64" y1="284" x2="64" y2="445" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(58,365) rotate(-90)">6.20</text>
    <line x1="64" y1="445" x2="64" y2="530" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(58,488) rotate(-90)">3.30</text>
    <line x1="64" y1="530" x2="64" y2="570" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(58,550) rotate(-90)">1.20</text>
  </g>
  <!-- ===== RIGHT : interior cotes ===== -->
  <g stroke="#9C7A4D" stroke-width="0.6" fill="#9C7A4D" font-size="8" text-anchor="middle" opacity="0.9">
    <line x1="440" y1="302" x2="440" y2="432" marker-start="url(#d)" marker-end="url(#d)"/><text transform="translate(446,367) rotate(-90)">podiums 5.00</text>
    <line x1="162" y1="446" x2="302" y2="446"/><text x="232" y="456">allée centrale ≥ 1.20</text>
  </g>

  <!-- entrance + clearances -->
  <text x="150" y="565" fill="#777" font-size="7">entrée 1.40</text>

  <!-- ===== NOTES ===== -->
  <rect x="500" y="96" width="456" height="230" fill="#1A1A1A" rx="4"/>
  <text x="518" y="120" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">CLEARANCES &amp; ACCESSIBILITÉ</text>
  <line x1="518" y1="128" x2="938" y2="128" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="10" fill="#EDE9E3">
    <text x="518" y="148">Allées principales</text><text x="938" y="148" text-anchor="end" fill="#9C7A4D">≥ 1.50 m</text>
    <text x="518" y="167">Entre podiums</text><text x="938" y="167" text-anchor="end" fill="#9C7A4D">≥ 1.20 m</text>
    <text x="518" y="186">Porte d'entrée (libre)</text><text x="938" y="186" text-anchor="end" fill="#9C7A4D">1.40 m</text>
    <text x="518" y="205">Accès réserve / BOH</text><text x="938" y="205" text-anchor="end" fill="#9C7A4D">0.90 m</text>
    <text x="518" y="224">Hauteur sous plafond</text><text x="938" y="224" text-anchor="end" fill="#9C7A4D">3.20 m</text>
    <text x="518" y="243">Aire de rotation PMR</text><text x="938" y="243" text-anchor="end" fill="#9C7A4D">Ø 1.50 m</text>
  </g>
  <text x="518" y="270" fill="#A9A399" font-size="8.5">▸ Toutes cotes indicatives, à relever sur site avant exécution.</text>
  <text x="518" y="284" fill="#A9A399" font-size="8.5">▸ Trame structurelle à confirmer (poteaux, réseaux, issues de secours).</text>
  <text x="518" y="298" fill="#A9A399" font-size="8.5">▸ Conformité ERP / accessibilité PMR à valider avec bureau de contrôle.</text>
  <text x="518" y="315" fill="#9C7A4D" font-size="9" font-weight="600">Surface utile ≈ 204 m² (hors cloisons).</text>

  <!-- legend bands -->
  <rect x="500" y="340" width="456" height="180" fill="#1A1A1A" rx="4"/>
  <text x="518" y="364" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">RÉPARTITION PAR BANDE (profondeur)</text>
  <line x1="518" y1="372" x2="938" y2="372" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="9.5" fill="#EDE9E3">
    <text x="518" y="392">Bande fond (BOH)</text><text x="700" y="392" text-anchor="end" fill="#9C7A4D">3.00 m</text><text x="720" y="392" fill="#A9A399">réserve + back-office</text>
    <text x="518" y="412">Bande service</text><text x="700" y="412" text-anchor="end" fill="#9C7A4D">3.30 m</text><text x="720" y="412" fill="#A9A399">prescription + comptoir/caisse</text>
    <text x="518" y="432">Bande showroom</text><text x="700" y="432" text-anchor="end" fill="#9C7A4D">6.20 m</text><text x="720" y="432" fill="#A9A399">podiums + room sets + matériauthèque</text>
    <text x="518" y="452">Bande accueil</text><text x="700" y="452" text-anchor="end" fill="#9C7A4D">3.30 m</text><text x="720" y="452" fill="#A9A399">accueil + signature + café</text>
    <text x="518" y="472">Bande façade</text><text x="700" y="472" text-anchor="end" fill="#9C7A4D">1.20 m</text><text x="720" y="472" fill="#A9A399">vitrine + entrée</text>
    <line x1="518" y1="484" x2="938" y2="484" stroke="#444"/>
    <text x="518" y="503" font-weight="600">Profondeur totale</text><text x="700" y="503" text-anchor="end" fill="#9C7A4D" font-weight="600">17.00 m</text>
  </g>

  <text x="28" y="636" fill="#999" font-size="9">DARTANK · Maison Drapée — Magasin 200 m² — Plan coté — itération 2 (détail)</text>
</svg>
