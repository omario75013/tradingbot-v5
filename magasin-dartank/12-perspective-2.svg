<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pfloor2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2dbcd"/><stop offset="1" stop-color="#c8bfae"/></linearGradient>
    <linearGradient id="pceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15130f"/><stop offset="1" stop-color="#221f1b"/></linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe6e6"/><stop offset="1" stop-color="#b7c2c2"/></linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.2" r="0.9"><stop offset="0" stop-color="#ffe9c0" stop-opacity="0.5"/><stop offset="1" stop-color="#ffe9c0" stop-opacity="0"/></radialGradient>
    <pattern id="ppaper" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#3a3833"/><path d="M11,3 q6,8 0,16 q-6,-8 0,-16" fill="none" stroke="#9C7A4D" stroke-width="0.9" opacity="0.6"/></pattern>
    <pattern id="pmosaic" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#5f574a"/><rect x="0.7" y="0.7" width="7.6" height="7.6" fill="#7d6f56"/></pattern>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">MAGASIN — VUE PERSPECTIVE 2 (VERS LA VITRINE)</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">AMBIANCE JOUR · LUMIÈRE NATURELLE</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">depuis le fond du magasin vers la rue</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- shell -->
  <polygon points="60,86 920,86 600,250 380,250" fill="url(#pceil)"/>
  <polygon points="60,600 920,600 600,410 380,410" fill="url(#pfloor2)"/>
  <g stroke="#b8ae9c" stroke-width="0.8" opacity="0.5"><line x1="160" y1="600" x2="490" y2="330"/><line x1="320" y1="600" x2="490" y2="330"/><line x1="660" y1="600" x2="490" y2="330"/><line x1="820" y1="600" x2="490" y2="330"/><line x1="120" y1="520" x2="860" y2="520"/></g>

  <!-- left wall : room sets -->
  <polygon points="60,86 60,600 380,410 380,250" fill="#23211d"/>
  <polygon points="60,156 130.4,179.8 130.4,429.7 60,448" fill="url(#ppaper)"/>
  <polygon points="130.4,179.8 220,205 220,405 130.4,429.7" fill="#bcb5a7"/>
  <rect x="150" y="250" width="46" height="120" fill="none" stroke="#e3ddd0" stroke-width="5"/>
  <polygon points="220,205 303.2,238.1 303.2,384.9 220,405" fill="url(#pmosaic)"/>
  <g stroke="#9C7A4D" stroke-width="1.4"><line x1="130.4" y1="179.8" x2="130.4" y2="429.7"/><line x1="220" y1="205" x2="220" y2="405"/></g>
  <polygon points="60,86 380,250 380,264 60,150" fill="#161412"/><line x1="60" y1="150" x2="380" y2="264" stroke="#9C7A4D" stroke-width="2"/>

  <!-- right wall : café / attente + entrance -->
  <polygon points="920,86 920,600 600,410 600,250" fill="#23211d"/>
  <polygon points="920,86 600,250 600,264 920,150" fill="#161412"/><line x1="920" y1="150" x2="600" y2="264" stroke="#9C7A4D" stroke-width="2"/>
  <!-- lounge -->
  <polygon points="760,360 900,360 900,470 740,470" fill="#2E3A35"/>
  <rect x="775" y="330" width="90" height="34" rx="5" fill="#2E3A35"/>
  <text x="820" y="320" fill="#6b6155" font-size="9" text-anchor="middle">café / attente</text>

  <!-- back : VITRINE (bright daylight) -->
  <polygon points="380,250 600,250 600,410 380,410" fill="url(#day)"/>
  <rect x="388" y="256" width="204" height="148" fill="url(#day)"/>
  <g stroke="#9aa6a6" stroke-width="2"><line x1="490" y1="256" x2="490" y2="404"/><line x1="388" y1="330" x2="592" y2="330"/></g>
  <!-- product phare silhouette in vitrine -->
  <rect x="455" y="300" width="20" height="90" fill="#8a7a5a" opacity="0.85"/>
  <rect x="482" y="312" width="26" height="78" fill="#6f6450" opacity="0.8"/>
  <text x="490" y="286" fill="#5a5650" font-size="11" letter-spacing="5" text-anchor="middle" font-weight="600">DARTANK</text>
  <text x="490" y="300" fill="#8a8278" font-size="5.5" letter-spacing="2" text-anchor="middle">vitrine sur rue</text>

  <!-- ceiling rails + spots -->
  <g stroke="#9C7A4D" stroke-width="2"><line x1="240" y1="118" x2="448" y2="252"/><line x1="740" y1="118" x2="552" y2="252"/></g>
  <g fill="#1A1A1A" stroke="#9C7A4D" stroke-width="1"><circle cx="320" cy="170" r="4"/><circle cx="660" cy="170" r="4"/><circle cx="490" cy="150" r="4"/></g>
  <polygon points="490,152 430,420 550,420" fill="url(#warm)"/>

  <!-- central podiums (seen from behind, toward vitrine) -->
  <g>
    <ellipse cx="430" cy="498" rx="58" ry="18" fill="#000" opacity="0.12"/>
    <polygon points="394,470 466,470 484,506 376,506" fill="#0e0d0c" stroke="#9C7A4D" stroke-width="1.2"/>
    <rect x="408" y="432" width="22" height="38" fill="#cdbfa6"/><rect x="434" y="440" width="22" height="30" fill="url(#pmosaic)"/>
  </g>
  <g>
    <polygon points="548,452 604,452 616,478 534,478" fill="#0e0d0c" stroke="#9C7A4D" stroke-width="1"/>
    <path d="M562,420 h24 v32 q-12,5 -24,0 z" fill="#b9a98a"/>
  </g>

  <rect x="0" y="610" width="980" height="50" fill="#1A1A1A"/>
  <g fill="#EDE9E3" font-size="10">
    <text x="28" y="630"><tspan fill="#9C7A4D" font-weight="600">Fond / rue</tspan> — Vitrine baignée de lumière naturelle, produit phare en contre-jour</text>
    <text x="28" y="648"><tspan fill="#9C7A4D" font-weight="600">Gauche</tspan> — Room sets (papier peint, moulures, mosaïque)</text>
    <text x="520" y="630"><tspan fill="#9C7A4D" font-weight="600">Droite</tspan> — Coin café / attente en velours vert</text>
    <text x="520" y="648"><tspan fill="#9C7A4D" font-weight="600">Centre</tspan> — Podiums produits guidant le regard vers la vitrine</text>
  </g>
  <text x="952" y="606" fill="#999" font-size="9" text-anchor="end">DARTANK · Maison Drapée — Magasin 200 m² — Perspective 2 — itération 2 (détail)</text>
</svg>
