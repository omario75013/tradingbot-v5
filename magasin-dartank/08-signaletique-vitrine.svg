<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brush" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a368"/><stop offset="0.5" stop-color="#9C7A4D"/><stop offset="1" stop-color="#7a5e38"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffdf9e" stop-opacity="0.75"/><stop offset="1" stop-color="#ffdf9e" stop-opacity="0"/></radialGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">SIGNALÉTIQUE, VITRINE &amp; LOGO — IDENTITÉ DE MARQUE</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">ENSEIGNE · VITRINE · MUR SIGNATURE</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">emblème portail · logotype · endossement</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- ===== A · PRIMARY LOCKUP (on anthracite) ===== -->
  <rect x="28" y="92" width="300" height="208" fill="#1A1A1A" rx="4"/>
  <text x="40" y="110" fill="#6b6155" font-size="8" letter-spacing="2">LOGO PRINCIPAL</text>
  <!-- emblem -->
  <g transform="translate(150,124) scale(0.95)">
    <path d="M6,72 L6,30 Q6,6 30,6 Q54,6 54,30 L54,72" fill="none" stroke="#9C7A4D" stroke-width="4"/>
    <path d="M16,72 L16,34 Q16,18 30,18 Q44,18 44,34 L44,72" fill="none" stroke="#9C7A4D" stroke-width="2"/>
    <rect x="25" y="2" width="10" height="13" fill="#9C7A4D"/>
    <rect x="2" y="71" width="56" height="3" fill="#9C7A4D"/>
  </g>
  <text x="178" y="240" fill="#EDE9E3" font-size="30" letter-spacing="11" text-anchor="middle" font-weight="600">DARTANK</text>
  <line x1="78" y1="252" x2="278" y2="252" stroke="#9C7A4D" stroke-width="1"/>
  <text x="178" y="270" fill="#9C7A4D" font-size="9" letter-spacing="5" text-anchor="middle">DÉCORATION ARCHITECTURALE</text>

  <!-- ===== A2 · secondary (on light) ===== -->
  <rect x="28" y="92" width="0" height="0"/>

  <!-- ===== B · FAÇADE ENSEIGNE (night) ===== -->
  <rect x="344" y="92" width="608" height="208" fill="#0e0d0c" rx="4"/>
  <text x="356" y="110" fill="#6b6155" font-size="8" letter-spacing="2">ENSEIGNE DE FAÇADE — LETTRES BOÎTIER LAITON, RÉTROÉCLAIRAGE HALO</text>
  <!-- facade structure -->
  <rect x="372" y="130" width="552" height="150" fill="#1A1A1A"/>
  <!-- fascia band -->
  <rect x="372" y="130" width="552" height="46" fill="#161513"/>
  <!-- glazing -->
  <rect x="392" y="186" width="240" height="86" fill="#15201f" opacity="0.9"/>
  <rect x="648" y="186" width="160" height="86" fill="#15201f" opacity="0.9"/>
  <line x1="512" y1="186" x2="512" y2="272" stroke="#2a2a28" stroke-width="2"/>
  <!-- entrance -->
  <rect x="824" y="186" width="84" height="86" fill="#0c1413"/>
  <!-- backlit sign on fascia -->
  <ellipse cx="600" cy="153" rx="220" ry="30" fill="url(#halo)"/>
  <g transform="translate(398,138) scale(0.36)">
    <path d="M6,72 L6,30 Q6,6 30,6 Q54,6 54,30 L54,72" fill="none" stroke="#caa46a" stroke-width="5"/>
    <rect x="25" y="2" width="10" height="13" fill="#caa46a"/><rect x="2" y="71" width="56" height="3" fill="#caa46a"/>
  </g>
  <text x="612" y="163" fill="#f3d79e" font-size="26" letter-spacing="10" text-anchor="middle" font-weight="600" filter="url(#emboss)">DARTANK</text>
  <text x="888" y="262" fill="#9C7A4D" font-size="7" text-anchor="end">entrée</text>

  <!-- ===== C · MUR D'ACCUEIL SIGNATURE ===== -->
  <rect x="28" y="316" width="300" height="208" fill="#1A1A1A" rx="4"/>
  <text x="40" y="334" fill="#6b6155" font-size="8" letter-spacing="2">MUR D'ACCUEIL — LETTRES BRONZE BROSSÉ + HALO</text>
  <ellipse cx="178" cy="420" rx="120" ry="55" fill="url(#halo)" opacity="0.6"/>
  <g transform="translate(150,356) scale(0.7)">
    <path d="M6,72 L6,30 Q6,6 30,6 Q54,6 54,30 L54,72" fill="none" stroke="url(#brush)" stroke-width="4"/>
    <rect x="25" y="2" width="10" height="13" fill="url(#brush)"/><rect x="2" y="71" width="56" height="3" fill="url(#brush)"/>
  </g>
  <text x="178" y="446" fill="url(#brush)" font-size="26" letter-spacing="9" text-anchor="middle" font-weight="600" filter="url(#emboss)">DARTANK</text>
  <text x="178" y="466" fill="#9C7A4D" font-size="7.5" letter-spacing="4" text-anchor="middle">DÉCORATION ARCHITECTURALE</text>
  <text x="178" y="500" fill="#6b6155" font-size="7" letter-spacing="3" text-anchor="middle">— en collaboration avec —</text>
  <text x="178" y="512" fill="#A9A399" font-size="10" letter-spacing="3" text-anchor="middle" font-style="italic">Maison Drapée</text>

  <!-- ===== D · ENDOSSEMENT + VARIANTES ===== -->
  <rect x="344" y="316" width="300" height="208" fill="#F8F5EF" stroke="#ddd" rx="4"/>
  <text x="356" y="334" fill="#999" font-size="8" letter-spacing="2">VERSION CLAIRE &amp; ENDOSSEMENT</text>
  <g transform="translate(466,344) scale(0.7)">
    <path d="M6,72 L6,30 Q6,6 30,6 Q54,6 54,30 L54,72" fill="none" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="25" y="2" width="10" height="13" fill="#1A1A1A"/><rect x="2" y="71" width="56" height="3" fill="#1A1A1A"/>
  </g>
  <text x="494" y="432" fill="#1A1A1A" font-size="24" letter-spacing="8" text-anchor="middle" font-weight="600">DARTANK</text>
  <line x1="404" y1="444" x2="584" y2="444" stroke="#9C7A4D" stroke-width="1"/>
  <text x="494" y="460" fill="#9C7A4D" font-size="8" letter-spacing="4" text-anchor="middle">DÉCORATION ARCHITECTURALE</text>
  <!-- co-brand lockup -->
  <text x="494" y="490" fill="#777" font-size="8" text-anchor="middle">marque sœur · papiers peints</text>
  <text x="494" y="508" fill="#1A1A1A" font-size="13" letter-spacing="2" text-anchor="middle" font-style="italic">Maison Drapée</text>

  <!-- ===== E · SIGNALÉTIQUE DIRECTIONNELLE ===== -->
  <rect x="660" y="316" width="292" height="208" fill="#1A1A1A" rx="4"/>
  <text x="672" y="334" fill="#6b6155" font-size="8" letter-spacing="2">PLAQUES DE ZONE — BRONZE SUR ANTHRACITE</text>
  <g>
    <rect x="676" y="346" width="124" height="34" fill="#232220" stroke="#9C7A4D" stroke-width="0.8"/><text x="688" y="367" fill="#9C7A4D" font-size="10" letter-spacing="2">01 · SOLS</text>
    <rect x="812" y="346" width="124" height="34" fill="#232220" stroke="#9C7A4D" stroke-width="0.8"/><text x="824" y="367" fill="#9C7A4D" font-size="10" letter-spacing="2">02 · MOULURES</text>
    <rect x="676" y="388" width="124" height="34" fill="#232220" stroke="#9C7A4D" stroke-width="0.8"/><text x="688" y="409" fill="#9C7A4D" font-size="10" letter-spacing="2">03 · MOSAÏQUES</text>
    <rect x="812" y="388" width="124" height="34" fill="#232220" stroke="#9C7A4D" stroke-width="0.8"/><text x="824" y="409" fill="#9C7A4D" font-size="9" letter-spacing="1">04 · PAPIERS P.</text>
    <rect x="676" y="430" width="260" height="34" fill="#9C7A4D"/><text x="806" y="451" fill="#1A1A1A" font-size="10" letter-spacing="2" text-anchor="middle" font-weight="600">PRESCRIPTION / CONSULTATION</text>
  </g>
  <text x="672" y="486" fill="#A9A399" font-size="8.5">Plaquettes gravées laiton, fixation aimantée — repositionnables.</text>
  <text x="672" y="500" fill="#A9A399" font-size="8.5">Pictogrammes minimalistes, même langage que l'étiquetage produit.</text>
  <text x="672" y="514" fill="#6b6155" font-size="8">Numérotation = renvoi au plan &amp; au catalogue digital.</text>

  <!-- ===== BOTTOM : TYPO / CLEAR SPACE / SPECS ===== -->
  <rect x="28" y="540" width="448" height="96" fill="#1A1A1A" rx="4"/>
  <text x="44" y="562" fill="#9C7A4D" font-size="11" letter-spacing="2" font-weight="600">TYPOGRAPHIE &amp; CONSTRUCTION</text>
  <line x1="44" y1="570" x2="460" y2="570" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="9" fill="#EDE9E3">
    <text x="44" y="586">▸ Logotype : capitales, linéale élégante, interlettrage large (≈ +10%)</text>
    <text x="44" y="601">▸ Emblème "portail" = évocation moulure / façade architecturale</text>
    <text x="44" y="616">▸ Endossement Maison Drapée en italique fin, jamais plus grand que DARTANK</text>
    <text x="44" y="630" fill="#A9A399" font-size="8">Zone de protection = hauteur du « D » sur tout le pourtour.</text>
  </g>
  <rect x="488" y="540" width="464" height="96" fill="#1A1A1A" rx="4"/>
  <text x="504" y="562" fill="#9C7A4D" font-size="11" letter-spacing="2" font-weight="600">MATIÈRES &amp; FABRICATION</text>
  <line x1="504" y1="570" x2="936" y2="570" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="9" fill="#EDE9E3">
    <text x="504" y="586">▸ Enseigne : lettres boîtier laiton brossé, rétroéclairage halo LED 3000K</text>
    <text x="504" y="601">▸ Mur signature : lettres relief bronze brossé sur fond microciment anthracite</text>
    <text x="504" y="616">▸ Vitrine : logo &amp; mention dépolis / sérigraphiés sur verre, lettrage laiton</text>
    <text x="504" y="630" fill="#A9A399" font-size="8">Cohérence façade ↔ vitrine ↔ intérieur ↔ étiquette produit ↔ catalogue digital.</text>
  </g>

  <text x="952" y="652" fill="#999" font-size="9" text-anchor="end">DARTANK · Maison Drapée — Magasin 200 m² — Signalétique, vitrine &amp; logo — itération 1</text>
</svg>
