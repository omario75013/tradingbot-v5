  <g stroke="#777" stroke-width="0.8">
    <line x1="129" y1="96" x2="536" y2="96"/>
    <line x1="129" y1="91" x2="129" y2="101"/><line x1="536" y1="91" x2="536" y2="101"/>
  </g>
  <text x="332" y="92" fill="#555" font-size="10" text-anchor="middle">7.00</text>
  <!-- left depth 10.00 -->
  <g stroke="#777" stroke-width="0.8">
    <line x1="112" y1="109" x2="112" y2="681"/>
    <line x1="107" y1="109" x2="117" y2="109"/><line x1="107" y1="681" x2="117" y2="681"/>
  </g>
  <text transform="translate(106,395) rotate(-90)" fill="#555" font-size="10" text-anchor="middle">10.00</text>

  <!-- north arrow -->
