  <g fill="none" stroke="#9C7A4D" stroke-width="2.2" stroke-dasharray="7 5" opacity="0.85" marker-end="url(#arrow)">
    <path d="M222,648 C220,600 250,580 300,545"/>
    <path d="M333,545 C333,500 333,420 333,372"/>
    <path d="M300,470 C250,470 210,460 178,440"/>
    <path d="M365,470 C420,470 460,460 490,440"/>
    <path d="M333,265 C360,235 400,215 430,205"/>
  </g>

  <!-- ===== zone number markers ===== -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="478" cy="600" r="11" fill="#9C7A4D"/><text x="478" y="604" fill="#1A1A1A">1</text>
    <circle cx="184" cy="395" r="11" fill="#9C7A4D"/><text x="184" y="399" fill="#1A1A1A">2</text>
    <circle cx="485" cy="390" r="11" fill="#9C7A4D"/><text x="485" y="394" fill="#1A1A1A">3</text>
    <circle cx="412" cy="313" r="11" fill="#9C7A4D"/><text x="412" y="317" fill="#1A1A1A">4</text>
    <circle cx="461" cy="210" r="11" fill="#9C7A4D"/><text x="461" y="214" fill="#1A1A1A">5</text>
    <circle cx="240" cy="200" r="11" fill="#9C7A4D"/><text x="240" y="204" fill="#1A1A1A">6</text>
