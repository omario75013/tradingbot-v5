    <circle r="13" fill="none" stroke="#777" stroke-width="1"/>
    <path d="M0,-11 L4,3 L0,0 L-4,3 z" fill="#1A1A1A"/>
    <text x="0" y="24" fill="#777" font-size="9" text-anchor="middle">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(140,700)">
    <rect x="0" y="0" width="55" height="6" fill="#1A1A1A"/><rect x="55" y="0" width="55" height="6" fill="#EAE5DD" stroke="#1A1A1A" stroke-width="0.6"/>
    <rect x="110" y="0" width="55" height="6" fill="#1A1A1A"/>
    <text x="0" y="20" fill="#555" font-size="9">0</text><text x="55" y="20" fill="#555" font-size="9" text-anchor="middle">1</text>
    <text x="110" y="20" fill="#555" font-size="9" text-anchor="middle">2</text><text x="165" y="20" fill="#555" font-size="9" text-anchor="middle">3 m</text>
  </g>

  <!-- ============ LEGEND PANEL ============ -->
  <rect x="560" y="96" width="296" height="585" fill="#1A1A1A" rx="4"/>
  <text x="578" y="124" fill="#9C7A4D" font-size="13" letter-spacing="3" font-weight="600">PROGRAMME</text>
  <line x1="578" y1="132" x2="838" y2="132" stroke="#9C7A4D" stroke-width="1"/>

  <g font-size="11" fill="#EDE9E3">
    <g><circle cx="588" cy="153" r="9" fill="#9C7A4D"/><text x="588" y="157" fill="#1A1A1A" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="606" y="151" font-weight="600">Entrée + mur signature</text><text x="606" y="165" fill="#A9A399" font-size="9.5">Enseigne façade · logo DARTANK</text></g>
    <g><circle cx="588" cy="190" r="9" fill="#9C7A4D"/><text x="588" y="194" fill="#1A1A1A" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="606" y="188" font-weight="600">Matériauthèque</text><text x="606" y="202" fill="#A9A399" font-size="9.5">Panneaux par gamme (sols, moulures…)</text></g>
    <g><circle cx="588" cy="227" r="9" fill="#9C7A4D"/><text x="588" y="231" fill="#1A1A1A" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <text x="606" y="225" font-weight="600">Ambiances scénarisées ×3</text><text x="606" y="239" fill="#A9A399" font-size="9.5">Produits posés en situation réelle</text></g>
    <g><circle cx="588" cy="264" r="9" fill="#9C7A4D"/><text x="588" y="268" fill="#1A1A1A" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <text x="606" y="262" font-weight="600">Prescription / consultation</text><text x="606" y="276" fill="#A9A399" font-size="9.5">Table 4 pers. + écran catalogue</text></g>
    <g><circle cx="588" cy="301" r="9" fill="#9C7A4D"/><text x="588" y="305" fill="#1A1A1A" font-size="11" font-weight="700" text-anchor="middle">5</text>
      <text x="606" y="299" font-weight="600">Comptoir + mini-réserve</text><text x="606" y="313" fill="#A9A399" font-size="9.5">Gammes à rotation rapide</text></g>
    <g><circle cx="588" cy="338" r="9" fill="#9C7A4D"/><text x="588" y="342" fill="#1A1A1A" font-size="11" font-weight="700" text-anchor="middle">6</text>
      <text x="606" y="336" font-weight="600">Back-office</text><text x="606" y="350" fill="#A9A399" font-size="9.5">Bureau commerciale</text></g>
  </g>

  <!-- circulation key -->
  <line x1="578" y1="372" x2="610" y2="372" stroke="#9C7A4D" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="620" y="376" fill="#EDE9E3" font-size="10">Parcours client / circulation</text>

  <!-- palette -->
  <text x="578" y="412" fill="#9C7A4D" font-size="13" letter-spacing="3" font-weight="600">PALETTE</text>
  <line x1="578" y1="420" x2="838" y2="420" stroke="#9C7A4D" stroke-width="1"/>
  <g>
    <rect x="578" y="434" width="58" height="40" fill="#1A1A1A" stroke="#444"/><text x="578" y="488" fill="#EDE9E3" font-size="8.5">Anthracite</text><text x="578" y="499" fill="#A9A399" font-size="8">#1A1A1A</text>
    <rect x="646" y="434" width="58" height="40" fill="#9C7A4D"/><text x="646" y="488" fill="#EDE9E3" font-size="8.5">Bronze</text><text x="646" y="499" fill="#A9A399" font-size="8">#9C7A4D</text>
    <rect x="714" y="434" width="58" height="40" fill="#EAE5DD"/><text x="714" y="488" fill="#EDE9E3" font-size="8.5">Pierre</text><text x="714" y="499" fill="#A9A399" font-size="8">#EAE5DD</text>
    <rect x="782" y="434" width="56" height="40" fill="#5a5650"/><text x="782" y="488" fill="#EDE9E3" font-size="8.5">Taupe</text><text x="782" y="499" fill="#A9A399" font-size="8">#5A5650</text>
  </g>

  <!-- surfaces table -->
  <text x="578" y="532" fill="#9C7A4D" font-size="13" letter-spacing="3" font-weight="600">SURFACES (indic.)</text>
  <line x1="578" y1="540" x2="838" y2="540" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="10" fill="#EDE9E3">
    <text x="578" y="558">Matériauthèque + ambiances</text><text x="838" y="558" text-anchor="end" fill="#9C7A4D">≈ 22 m²</text>
    <text x="578" y="576">Prescription / consultation</text><text x="838" y="576" text-anchor="end" fill="#9C7A4D">≈ 12 m²</text>
    <text x="578" y="594">Entrée / accueil + circulation</text><text x="838" y="594" text-anchor="end" fill="#9C7A4D">≈ 20 m²</text>
    <text x="578" y="612">Comptoir + mini-réserve</text><text x="838" y="612" text-anchor="end" fill="#9C7A4D">≈ 9 m²</text>
    <text x="578" y="630">Back-office</text><text x="838" y="630" text-anchor="end" fill="#9C7A4D">≈ 5 m²</text>
    <line x1="578" y1="642" x2="838" y2="642" stroke="#444"/>
    <text x="578" y="660" font-weight="600">TOTAL</text><text x="838" y="660" text-anchor="end" fill="#9C7A4D" font-weight="600">≈ 68 m²</text>
  </g>

  <text x="28" y="745" fill="#555" font-size="10">Concept évolutif &amp; économe — présentoirs modulables · système de rails d'éclairage · panneaux interchangeables</text>
  <text x="28" y="762" fill="#999" font-size="9">DARTANK · Maison Drapée  —  Concept showroom de prescription  —  Vue d'ensemble (itération 0)</text>

  </svg>
  <text x="12.0" y="292.0" fill="#999" font-size="3.2">DARTANK · Dossier showroom de prescription · 70 m²</text>
