<svg xmlns="http://www.w3.org/2000/svg" width="420.0mm" height="297.0mm" viewBox="0 0 420.0 297.0" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="420.0" height="297.0" fill="#FFFFFF"/>
  <rect x="10.0" y="13.15306122448979" width="400.0" height="270.6938775510204" fill="none" stroke="#9C7A4D" stroke-width="0.3"/>
  <svg x="12.0" y="15.15306122448979" width="396.0" height="266.6938775510204" viewBox="0 0 980 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C7A4D"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#1A1A1A"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#3a3a3a" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="880" height="820" fill="#F3F0EA"/>

  <!-- title block -->
  <rect x="0" y="0" width="880" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="28" letter-spacing="9" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">DÉCORATION ARCHITECTURALE — SHOWROOM DE PRESCRIPTION</text>
  <text x="852" y="32" fill="#EDE9E3" font-size="13" text-anchor="end" letter-spacing="1">PLAN D'AMÉNAGEMENT 2D</text>
  <text x="852" y="52" fill="#9C7A4D" font-size="11" text-anchor="end" letter-spacing="1">70 m² (7 × 10 m) · éch. ≈ 1:55 · cotes en m</text>
  <line x1="0" y1="74" x2="880" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- ============ PLAN ============ -->
  <!-- exterior walls (poché) -->
  <rect x="129" y="109" width="407" height="572" fill="#1A1A1A"/>
  <!-- interior floor -->
  <rect x="140" y="120" width="385" height="550" fill="#EAE5DD"/>

  <!-- subtle floor grid (1 m) -->
  <g stroke="#dcd5ca" stroke-width="0.6">
    <line x1="195" y1="120" x2="195" y2="670"/><line x1="250" y1="120" x2="250" y2="670"/>
    <line x1="305" y1="120" x2="305" y2="670"/><line x1="360" y1="120" x2="360" y2="670"/>
    <line x1="415" y1="120" x2="415" y2="670"/><line x1="470" y1="120" x2="470" y2="670"/>
    <line x1="140" y1="175" x2="525" y2="175"/><line x1="140" y1="230" x2="525" y2="230"/>
    <line x1="140" y1="285" x2="525" y2="285"/><line x1="140" y1="340" x2="525" y2="340"/>
    <line x1="140" y1="395" x2="525" y2="395"/><line x1="140" y1="450" x2="525" y2="450"/>
    <line x1="140" y1="505" x2="525" y2="505"/><line x1="140" y1="560" x2="525" y2="560"/>
    <line x1="140" y1="615" x2="525" y2="615"/>
  </g>

  <!-- ===== ZONE 2 : Matériauthèque (west wall) ===== -->
  <rect x="140" y="219" width="24" height="341" fill="#9C7A4D" opacity="0.9"/>
  <g stroke="#EAE5DD" stroke-width="1">
    <line x1="140" y1="304" x2="164" y2="304"/><line x1="140" y1="389" x2="164" y2="389"/><line x1="140" y1="474" x2="164" y2="474"/>
  </g>
  <g fill="#F3F0EA" font-size="8.5" letter-spacing="1" text-anchor="middle">
    <text transform="translate(155,262) rotate(-90)">SOLS</text>
    <text transform="translate(155,347) rotate(-90)">MOULURES</text>
    <text transform="translate(155,432) rotate(-90)">MOSAÏQUES</text>
    <text transform="translate(155,517) rotate(-90)">PAP. PEINTS</text>
  </g>

  <!-- ===== ZONE 3 : Ambiances scénarisées (east wall) ===== -->
  <rect x="501" y="219" width="24" height="341" fill="#5a5650"/>
  <g stroke="#9C7A4D" stroke-width="1.5">
    <line x1="501" y1="333" x2="525" y2="333"/><line x1="501" y1="447" x2="525" y2="447"/>
  </g>
  <g fill="#EDE9E3" font-size="8" letter-spacing="0.5" text-anchor="middle">
    <text transform="translate(513,276) rotate(-90)">AMBIANCE 1</text>
    <text transform="translate(513,390) rotate(-90)">AMBIANCE 2</text>
    <text transform="translate(513,504) rotate(-90)">AMBIANCE 3</text>
  </g>

  <!-- ===== ZONE 1 : Entrée + mur signature (front-east) ===== -->
  <rect x="501" y="571" width="24" height="88" fill="#1A1A1A"/>
  <rect x="497" y="571" width="4" height="88" fill="#9C7A4D"/>
  <text transform="translate(512,615) rotate(-90)" fill="#9C7A4D" font-size="9" letter-spacing="4" text-anchor="middle">DARTANK</text>

  <!-- storefront glazing (front wall) -->
  <line x1="164" y1="666" x2="184" y2="666" stroke="#7FA8B5" stroke-width="3"/>
  <line x1="261" y1="666" x2="497" y2="666" stroke="#7FA8B5" stroke-width="3"/>
  <!-- entrance door + swing -->
  <line x1="184" y1="668" x2="184" y2="591" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M184,591 A77,77 0 0 1 261,668" fill="none" stroke="#9C7A4D" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="222" y="690" fill="#555" font-size="9" text-anchor="middle">entrée</text>

  <!-- ===== ZONE 4 : Prescription / consultation ===== -->
  <!-- partition with screen (north of table) -->
  <line x1="266" y1="230" x2="398" y2="230" stroke="#1A1A1A" stroke-width="6"/>
  <rect x="300" y="231" width="65" height="6" fill="#9C7A4D"/>
  <text x="332" y="250" fill="#555" font-size="8" text-anchor="middle">écran catalogue</text>
  <!-- meeting table 4 pers -->
  <rect x="288" y="282" width="90" height="62" rx="6" fill="#2b2926" filter="url(#soft)"/>
  <g fill="#9C7A4D">
    <rect x="300" y="270" width="22" height="9" rx="2"/><rect x="344" y="270" width="22" height="9" rx="2"/>
    <rect x="300" y="347" width="22" height="9" rx="2"/><rect x="344" y="347" width="22" height="9" rx="2"/>
  </g>
  <text x="333" y="316" fill="#EDE9E3" font-size="8" text-anchor="middle">TABLE 4p</text>

  <!-- ===== central island (matériauthèque double-face) ===== -->
  <rect x="305" y="450" width="55" height="100" rx="3" fill="#cdbfa6" stroke="#9C7A4D" stroke-width="1.5" filter="url(#soft)"/>
  <g stroke="#9C7A4D" stroke-width="0.8"><line x1="332" y1="450" x2="332" y2="550"/>
    <line x1="305" y1="475" x2="360" y2="475"/><line x1="305" y1="500" x2="360" y2="500"/><line x1="305" y1="525" x2="360" y2="525"/></g>
  <text x="332" y="565" fill="#555" font-size="8" text-anchor="middle">îlot échantillons (double face)</text>

  <!-- welcome console (entry) -->
  <rect x="300" y="612" width="64" height="16" rx="3" fill="#2b2926"/>
  <text x="332" y="643" fill="#555" font-size="8" text-anchor="middle">accueil / console</text>

  <!-- ===== ZONE 5 + 6 : rear band ===== -->
  <!-- back-office partition -->
  <line x1="266" y1="120" x2="266" y2="230" stroke="#1A1A1A" stroke-width="6"/>
  <!-- back-office desk -->
  <rect x="156" y="148" width="82" height="34" rx="2" fill="#2b2926"/>
  <circle cx="197" cy="200" r="9" fill="none" stroke="#555" stroke-width="1.5"/>
