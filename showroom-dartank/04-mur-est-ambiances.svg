<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="ewood" width="7" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="7" height="9" fill="#8a6a45"/><line x1="0" y1="0" x2="0" y2="9" stroke="#6f5436" stroke-width="0.8"/>
    </pattern>
    <pattern id="epaper" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3a3833"/>
      <path d="M10,2 q6,8 0,16 q-6,-8 0,-16" fill="none" stroke="#9C7A4D" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <pattern id="emosaic" width="11" height="11" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#5f574a"/><rect x="0.8" y="0.8" width="9.4" height="9.4" fill="#7d6f56"/>
    </pattern>
    <linearGradient id="estone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc8ba"/><stop offset="1" stop-color="#aaa295"/>
    </linearGradient>
    <linearGradient id="emould" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ede5"/><stop offset="1" stop-color="#c2bbab"/>
    </linearGradient>
    <radialGradient id="elight" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff6e2" stop-opacity="0.5"/><stop offset="1" stop-color="#fff6e2" stop-opacity="0"/>
    </radialGradient>
    <filter id="esh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">AMBIANCES SCÉNARISÉES — ÉLÉVATION MUR EST</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">PRODUITS POSÉS EN SITUATION RÉELLE</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">L 6.00 × H 3.20 m · éch. ≈ 1:60</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- lighting rail + spots (2 per bay) -->
  <rect x="85" y="108" width="570" height="4" rx="2" fill="#9C7A4D"/>
  <g fill="url(#elight)">
    <polygon points="135,114 95,300 175,300"/><polygon points="225,114 185,300 265,300"/>
    <polygon points="325,114 285,300 365,300"/><polygon points="415,114 375,300 455,300"/>
    <polygon points="515,114 475,300 555,300"/><polygon points="605,114 565,300 645,300"/>
  </g>
  <g fill="#1A1A1A" stroke="#9C7A4D" stroke-width="1">
    <circle cx="135" cy="112" r="3.5"/><circle cx="225" cy="112" r="3.5"/><circle cx="325" cy="112" r="3.5"/><circle cx="415" cy="112" r="3.5"/><circle cx="515" cy="112" r="3.5"/><circle cx="605" cy="112" r="3.5"/>
  </g>

  <!-- ceiling + floor lines -->
  <line x1="85" y1="124" x2="655" y2="124" stroke="#bbb" stroke-width="1"/>
  <rect x="75" y="420" width="590" height="9" fill="#d9d2c6"/>
  <line x1="75" y1="420" x2="665" y2="420" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- bay separators -->
  <line x1="275" y1="124" x2="275" y2="420" stroke="#1A1A1A" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="465" y1="124" x2="465" y2="420" stroke="#1A1A1A" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- ===================== BAY 1 — SÉJOUR ===================== -->
  <clipPath id="b1"><rect x="85" y="124" width="190" height="296"/></clipPath>
  <g clip-path="url(#b1)">
    <rect x="85" y="138" width="190" height="252" fill="url(#epaper)"/>
    <!-- cornice -->
    <rect x="85" y="126" width="190" height="13" fill="url(#emould)" filter="url(#esh)"/>
    <!-- parquet floor band -->
    <polygon points="85,390 275,390 275,420 85,420" fill="url(#ewood)"/>
    <g stroke="#5e4628" stroke-width="0.6" opacity="0.5"><line x1="120" y1="390" x2="100" y2="420"/><line x1="160" y1="390" x2="150" y2="420"/><line x1="210" y1="390" x2="215" y2="420"/></g>
    <!-- skirting -->
    <rect x="85" y="383" width="190" height="8" fill="#9C7A4D"/>
    <!-- staging: console + mirror + vase -->
    <rect x="120" y="338" width="80" height="10" rx="2" fill="#1A1A1A" filter="url(#esh)"/>
    <line x1="128" y1="348" x2="128" y2="383" stroke="#1A1A1A" stroke-width="3"/><line x1="192" y1="348" x2="192" y2="383" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="160" cy="250" r="32" fill="#2b2926" stroke="#9C7A4D" stroke-width="2.5"/>
    <ellipse cx="218" cy="324" rx="9" ry="16" fill="#5a5650"/>
  </g>
  <rect x="85" y="124" width="190" height="296" fill="none" stroke="#9C7A4D" stroke-width="1.2"/>

  <!-- ===================== BAY 2 — FAÇADE ===================== -->
  <clipPath id="b2"><rect x="275" y="124" width="190" height="296"/></clipPath>
  <g clip-path="url(#b2)">
    <rect x="275" y="124" width="190" height="296" fill="#bcb5a7"/>
    <!-- entablature / corniche -->
    <rect x="275" y="140" width="190" height="20" fill="url(#emould)" filter="url(#esh)"/>
    <rect x="275" y="160" width="190" height="6" fill="#d4cdbe"/>
    <!-- pilasters -->
    <g filter="url(#esh)">
      <rect x="292" y="166" width="18" height="200" fill="url(#emould)"/>
      <rect x="430" y="166" width="18" height="200" fill="url(#emould)"/>
    </g>
    <g stroke="#b0a795" stroke-width="0.8"><line x1="298" y1="170" x2="298" y2="362"/><line x1="304" y1="170" x2="304" y2="362"/><line x1="436" y1="170" x2="436" y2="362"/><line x1="442" y1="170" x2="442" y2="362"/></g>
    <!-- capitals + bases -->
    <rect x="288" y="166" width="26" height="8" fill="#e3ddd0"/><rect x="426" y="166" width="26" height="8" fill="#e3ddd0"/>
    <rect x="288" y="358" width="26" height="8" fill="#d4cdbe"/><rect x="426" y="358" width="26" height="8" fill="#d4cdbe"/>
    <!-- molded panel (cadre) -->
    <rect x="335" y="195" width="70" height="135" fill="none" stroke="#e9e3d6" stroke-width="6"/>
    <rect x="335" y="195" width="70" height="135" fill="none" stroke="#a59c8a" stroke-width="1.5"/>
    <!-- bossage base -->
    <g fill="#cfc8ba" stroke="#a59c8a" stroke-width="0.8">
      <rect x="275" y="370" width="62" height="14"/><rect x="337" y="370" width="62" height="14"/><rect x="399" y="370" width="66" height="14"/>
      <rect x="275" y="386" width="92" height="14"/><rect x="367" y="386" width="98" height="14"/>
    </g>
  </g>
  <rect x="275" y="124" width="190" height="296" fill="none" stroke="#9C7A4D" stroke-width="1.2"/>

  <!-- ===================== BAY 3 — MINÉRAL ===================== -->
  <clipPath id="b3"><rect x="465" y="124" width="190" height="296"/></clipPath>
  <g clip-path="url(#b3)">
    <rect x="465" y="124" width="190" height="296" fill="#9a9286"/>
    <!-- corniche -->
    <rect x="465" y="138" width="190" height="12" fill="url(#emould)" filter="url(#esh)"/>
    <!-- large format stone slabs (upper) -->
    <g stroke="#8a8275" stroke-width="1">
      <rect x="475" y="156" width="85" height="150" fill="url(#estone)"/>
      <rect x="562" y="156" width="83" height="150" fill="url(#estone)"/>
    </g>
    <!-- mosaic dado (lower, below 1.10 m) -->
    <rect x="465" y="306" width="190" height="80" fill="url(#emosaic)"/>
    <!-- bronze trim between -->
    <rect x="465" y="303" width="190" height="3" fill="#9C7A4D"/>
    <!-- skirting -->
    <rect x="465" y="386" width="190" height="6" fill="#1A1A1A"/>
    <!-- wall sconce -->
    <rect x="555" y="200" width="10" height="30" rx="3" fill="#9C7A4D"/><ellipse cx="560" cy="198" rx="14" ry="5" fill="url(#elight)"/>
  </g>
  <rect x="465" y="124" width="190" height="296" fill="none" stroke="#9C7A4D" stroke-width="1.2"/>

  <!-- bay labels + captions -->
  <g text-anchor="middle">
    <rect x="105" y="432" width="150" height="14" fill="#1A1A1A"/><text x="180" y="442" fill="#9C7A4D" font-size="9" letter-spacing="1">AMBIANCE 1 · SÉJOUR</text>
    <rect x="295" y="432" width="150" height="14" fill="#1A1A1A"/><text x="370" y="442" fill="#9C7A4D" font-size="9" letter-spacing="1">AMBIANCE 2 · FAÇADE</text>
    <rect x="485" y="432" width="150" height="14" fill="#1A1A1A"/><text x="560" y="442" fill="#9C7A4D" font-size="9" letter-spacing="1">AMBIANCE 3 · MINÉRAL</text>
  </g>
  <g fill="#555" font-size="8" text-anchor="middle">
    <text x="180" y="460">Parquet posé + papier peint tendu</text><text x="180" y="471">(Maison Drapée) + corniche + console</text>
    <text x="370" y="460">Moulures de façade montées :</text><text x="370" y="471">pilastres, corniche, cadre, bossage</text>
    <text x="560" y="460">Mosaïque (soubassement) + pierre</text><text x="560" y="471">grand format + corniche + applique</text>
  </g>

  <!-- dims -->
  <g stroke="#777" stroke-width="0.8">
    <line x1="85" y1="96" x2="655" y2="96"/><line x1="85" y1="91" x2="85" y2="101"/><line x1="655" y1="91" x2="655" y2="101"/>
    <line x1="275" y1="93" x2="275" y2="99"/><line x1="465" y1="93" x2="465" y2="99"/>
  </g>
  <g fill="#555" font-size="9" text-anchor="middle"><text x="180" y="92">2.00</text><text x="370" y="92">2.00</text><text x="560" y="92">2.00</text></g>
  <g stroke="#777" stroke-width="0.8">
    <line x1="66" y1="124" x2="66" y2="420"/><line x1="61" y1="124" x2="71" y2="124"/><line x1="61" y1="420" x2="71" y2="420"/>
  </g>
  <text transform="translate(60,272) rotate(-90)" fill="#555" font-size="9" text-anchor="middle">3.20</text>
  <!-- dado height note bay3 -->
  <text x="660" y="312" fill="#9C7A4D" font-size="7">soubas. 1.10</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="690" y="92" width="266" height="408" fill="#1A1A1A" rx="4"/>
  <text x="708" y="118" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">PRINCIPE DE SCÉNOGRAPHIE</text>
  <line x1="708" y1="126" x2="938" y2="126" stroke="#9C7A4D" stroke-width="1"/>
  <g fill="#EDE9E3" font-size="9.5">
    <text x="708" y="146">▸ 3 niches de 2.00 m, cadrées bronze</text>
    <text x="708" y="165">▸ Produits posés "comme chez le client"</text>
    <text x="708" y="184">▸ 2 spots / niche, faisceau resserré</text>
    <text x="708" y="203">▸ Décors interchangeables (même</text>
    <text x="720" y="216" fill="#A9A399" font-size="8.5">système modulable que la matériauthèque)</text>
  </g>

  <text x="708" y="246" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">PRODUITS MIS EN SCÈNE</text>
  <line x1="708" y1="254" x2="938" y2="254" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="9" fill="#EDE9E3">
    <rect x="708" y="264" width="14" height="14" fill="url(#epaper)"/><text x="730" y="275">Séjour — papier peint + parquet</text>
    <rect x="708" y="286" width="14" height="14" fill="url(#emould)"/><text x="730" y="297">Façade — moulures &amp; corniches</text>
    <rect x="708" y="308" width="14" height="14" fill="url(#emosaic)"/><text x="730" y="319">Minéral — mosaïque + pierre</text>
  </g>

  <text x="708" y="350" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">ÉVOLUTIVITÉ</text>
  <line x1="708" y1="358" x2="938" y2="358" stroke="#9C7A4D" stroke-width="1"/>
  <text x="708" y="378" fill="#A9A399" font-size="8.8">Chaque niche se re-scénographie au</text>
  <text x="708" y="391" fill="#A9A399" font-size="8.8">lancement d'une collection : on change</text>
  <text x="708" y="404" fill="#A9A399" font-size="8.8">le papier peint tendu, la moulure montée</text>
  <text x="708" y="417" fill="#A9A399" font-size="8.8">ou le calepinage mural — sans gros œuvre.</text>
  <text x="708" y="440" fill="#EDE9E3" font-size="8.8">Rotation conseillée : 2×/an, ou au gré</text>
  <text x="708" y="453" fill="#EDE9E3" font-size="8.8">des projets phares en cours.</text>

  <text x="28" y="636" fill="#999" font-size="9">DARTANK · Maison Drapée — Élévation mur est (3 ambiances) — itération 1 ter</text>
</svg>
