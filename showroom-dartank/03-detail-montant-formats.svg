<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d8d1c5"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9a917f" stroke-width="0.8"/>
    </pattern>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C7A4D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#F3F0EA"/>
  <rect x="0" y="0" width="980" height="74" fill="#1A1A1A"/>
  <text x="28" y="36" fill="#9C7A4D" font-size="26" letter-spacing="8" font-weight="600">DARTANK</text>
  <text x="28" y="58" fill="#C9C4BB" font-size="11" letter-spacing="3">MATÉRIAUTHÈQUE — DÉTAIL MONTANT &amp; FORMATS D'ÉCHANTILLONS</text>
  <text x="952" y="32" fill="#EDE9E3" font-size="13" text-anchor="end">SYSTÈME À CRÉMAILLÈRE</text>
  <text x="952" y="52" fill="#9C7A4D" font-size="11" text-anchor="end">détail ≈ 1:5 · cotes en mm</text>
  <line x1="0" y1="74" x2="980" y2="74" stroke="#9C7A4D" stroke-width="2"/>

  <!-- =============== A. AXONOMÉTRIE EXPLODÉE =============== -->
  <text x="40" y="104" fill="#1A1A1A" font-size="12" font-weight="600" letter-spacing="1">A · PRINCIPE — ÉCLATÉ</text>
  <line x1="40" y1="110" x2="300" y2="110" stroke="#9C7A4D" stroke-width="1"/>

  <!-- wall slab -->
  <g transform="translate(60,130)">
    <polygon points="0,40 40,18 40,178 0,200" fill="url(#hatch)" stroke="#9a917f" stroke-width="1"/>
    <polygon points="40,18 56,12 56,172 40,178" fill="#c7c0b3" stroke="#9a917f" stroke-width="1"/>
    <text x="6" y="120" fill="#777" font-size="8" transform="rotate(-58 6 120)">mur support</text>
  </g>
  <!-- upright (montant crémaillère) -->
  <g transform="translate(120,118)">
    <polygon points="0,40 14,33 14,193 0,200" fill="#9C7A4D"/>
    <polygon points="14,33 22,29 22,189 14,193" fill="#7a5e38"/>
    <!-- slots -->
    <g fill="#1A1A1A"><rect x="3" y="55" width="6" height="4"/><rect x="3" y="73" width="6" height="4"/><rect x="3" y="91" width="6" height="4"/><rect x="3" y="109" width="6" height="4"/><rect x="3" y="127" width="6" height="4"/><rect x="3" y="145" width="6" height="4"/><rect x="3" y="163" width="6" height="4"/></g>
    <text x="-2" y="216" fill="#9C7A4D" font-size="8">montant bronze</text>
  </g>
  <!-- clip / bracket -->
  <g transform="translate(165,150)">
    <path d="M0,0 h22 v8 h-14 v22 h-8 z" fill="#5a5650"/>
    <line x1="186" y1="-6" x2="14" y2="6" stroke="#9C7A4D" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar2)"/>
    <text x="2" y="44" fill="#5a5650" font-size="8">clip / bras</text>
  </g>
  <!-- panel with sample -->
  <g transform="translate(225,120)">
    <polygon points="0,30 60,8 60,168 0,190" fill="#2b2926" stroke="#1A1A1A"/>
    <polygon points="6,40 54,22 54,150 6,168" fill="#cdbfa6"/>
    <text x="10" y="208" fill="#1A1A1A" font-size="8">panneau interchangeable + échantillon</text>
  </g>
  <text x="305" y="170" fill="#9C7A4D" font-size="9" font-weight="600">clip sans outil →</text>
  <text x="305" y="184" fill="#777" font-size="8">repositionnable au pas de 32 mm</text>

  <!-- =============== B. COUPE VERTICALE =============== -->
  <text x="40" y="372" fill="#1A1A1A" font-size="12" font-weight="600" letter-spacing="1">B · COUPE VERTICALE</text>
  <line x1="40" y1="378" x2="250" y2="378" stroke="#9C7A4D" stroke-width="1"/>
  <g transform="translate(70,392)">
    <!-- upright -->
    <rect x="0" y="0" width="22" height="220" fill="#9C7A4D"/>
    <rect x="22" y="0" width="4" height="220" fill="#7a5e38"/>
    <g fill="#1A1A1A"><!-- slots every 18px = 32mm -->
      <rect x="7" y="14" width="8" height="6"/><rect x="7" y="32" width="8" height="6"/><rect x="7" y="50" width="8" height="6"/><rect x="7" y="68" width="8" height="6"/><rect x="7" y="86" width="8" height="6"/><rect x="7" y="104" width="8" height="6"/><rect x="7" y="122" width="8" height="6"/><rect x="7" y="140" width="8" height="6"/><rect x="7" y="158" width="8" height="6"/><rect x="7" y="176" width="8" height="6"/><rect x="7" y="194" width="8" height="6"/>
    </g>
    <!-- engaged hook + panel -->
    <path d="M7,88 h-14 v-6 l-10,4 v34 h24 z" fill="#5a5650"/>
    <rect x="-50" y="92" width="44" height="120" fill="#2b2926"/>
    <rect x="-46" y="98" width="36" height="108" fill="#cdbfa6"/>
    <!-- pitch dim -->
    <g stroke="#777" stroke-width="0.7">
      <line x1="40" y1="86" x2="40" y2="104" marker-start="url(#dim)" marker-end="url(#dim)"/>
    </g>
    <text x="46" y="98" fill="#777" font-size="8">entraxe 32</text>
    <text x="-44" y="228" fill="#777" font-size="8">panneau ép. 19</text>
  </g>

  <!-- =============== C. COUPE HORIZONTALE =============== -->
  <text x="300" y="372" fill="#1A1A1A" font-size="12" font-weight="600" letter-spacing="1">C · COUPE HORIZONTALE</text>
  <line x1="300" y1="378" x2="540" y2="378" stroke="#9C7A4D" stroke-width="1"/>
  <g transform="translate(320,400)">
    <!-- wall -->
    <rect x="0" y="0" width="34" height="150" fill="url(#hatch)" stroke="#9a917f"/>
    <!-- bracket/spacer -->
    <rect x="34" y="60" width="20" height="14" fill="#5a5650"/>
    <!-- upright -->
    <rect x="54" y="30" width="16" height="100" fill="#9C7A4D"/>
    <!-- panel -->
    <rect x="70" y="20" width="14" height="120" fill="#2b2926"/>
    <rect x="84" y="22" width="6" height="116" fill="#cdbfa6"/>
    <!-- dim chain -->
    <g stroke="#777" stroke-width="0.7" fill="#777" font-size="8">
      <line x1="0" y1="168" x2="34" y2="168" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="6" y="182">mur</text>
      <line x1="34" y1="168" x2="54" y2="168" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="34" y="182">20</text>
      <line x1="54" y1="168" x2="70" y2="168" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="52" y="194">30</text>
      <line x1="70" y1="168" x2="90" y2="168" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="70" y="182">19</text>
    </g>
    <text x="40" y="20" fill="#777" font-size="8">entretoise</text>
    <text x="96" y="80" fill="#1A1A1A" font-size="8">échantillon affleurant</text>
    <text x="40" y="148" fill="#777" font-size="7">saillie totale ≈ 70 mm</text>
  </g>

  <!-- =============== TABLE FORMATS / RÉFÉRENCES =============== -->
  <rect x="560" y="92" width="396" height="408" fill="#1A1A1A" rx="4"/>
  <text x="578" y="118" fill="#9C7A4D" font-size="13" letter-spacing="2" font-weight="600">FORMATS &amp; RÉFÉRENCES PAR GAMME</text>
  <line x1="578" y1="126" x2="938" y2="126" stroke="#9C7A4D" stroke-width="1"/>
  <!-- header -->
  <g fill="#A9A399" font-size="8.5">
    <text x="578" y="146">GAMME</text><text x="690" y="146">FORMAT</text><text x="800" y="146">SUPPORT</text><text x="930" y="146" text-anchor="end">RÉF.</text>
  </g>
  <line x1="578" y1="152" x2="938" y2="152" stroke="#3a3833"/>
  <g font-size="9" fill="#EDE9E3">
    <text x="578" y="172" font-weight="600">Sols</text><text x="690" y="172">board 40×60</text><text x="800" y="172">board clipsé</text><text x="930" y="172" text-anchor="end" fill="#9C7A4D">9</text>
    <line x1="578" y1="182" x2="938" y2="182" stroke="#2a2926"/>
    <text x="578" y="202" font-weight="600">Moulures /</text><text x="578" y="213" font-weight="600">corniches</text><text x="690" y="207">profil réel L.50</text><text x="800" y="207">bras profilé</text><text x="930" y="207" text-anchor="end" fill="#9C7A4D">10</text>
    <line x1="578" y1="222" x2="938" y2="222" stroke="#2a2926"/>
    <text x="578" y="242" font-weight="600">Mosaïques</text><text x="690" y="242">plaque 30×30</text><text x="800" y="242">plaque aimantée</text><text x="930" y="242" text-anchor="end" fill="#9C7A4D">12</text>
    <line x1="578" y1="252" x2="938" y2="252" stroke="#2a2926"/>
    <text x="578" y="272" font-weight="600">Papiers peints</text><text x="578" y="283" fill="#A9A399" font-size="7.5">+ Maison Drapée</text><text x="690" y="277">lé 50×140</text><text x="800" y="277">barre + lest bas</text><text x="930" y="277" text-anchor="end" fill="#9C7A4D">10</text>
    <line x1="578" y1="292" x2="938" y2="292" stroke="#3a3833"/>
    <text x="578" y="310" font-weight="600">TOTAL linéaire 6.20 m</text><text x="930" y="310" text-anchor="end" fill="#9C7A4D" font-weight="600">41 réf.</text>
  </g>

  <!-- étiquetage -->
  <text x="578" y="340" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">ÉTIQUETAGE &amp; RÉFÉRENCEMENT</text>
  <line x1="578" y1="348" x2="938" y2="348" stroke="#9C7A4D" stroke-width="1"/>
  <g transform="translate(578,360)">
    <rect x="0" y="0" width="120" height="34" rx="3" fill="#9C7A4D"/>
    <text x="8" y="14" fill="#1A1A1A" font-size="8" font-weight="700">DARTANK · SOLS</text>
    <text x="8" y="26" fill="#1A1A1A" font-size="7">Réf. DK-S-204 · Chêne fumé</text>
    <rect x="96" y="4" width="20" height="20" fill="#1A1A1A"/>
    <g fill="#9C7A4D"><rect x="99" y="7" width="4" height="4"/><rect x="109" y="7" width="4" height="4"/><rect x="99" y="17" width="4" height="4"/><rect x="104" y="12" width="4" height="4"/></g>
  </g>
  <text x="710" y="372" fill="#EDE9E3" font-size="8.5">▸ Plaquette bronze gravée :</text>
  <text x="722" y="385" fill="#A9A399" font-size="8">réf. + nom de collection</text>
  <text x="710" y="400" fill="#EDE9E3" font-size="8.5">▸ QR → fiche technique digitale</text>
  <text x="722" y="413" fill="#A9A399" font-size="8">(specs, formats dispo, prix prescr.)</text>

  <!-- proportions avant/après -->
  <text x="578" y="438" fill="#9C7A4D" font-size="12" letter-spacing="2" font-weight="600">PROPORTIONS — RÉÉQUILIBRAGE</text>
  <line x1="578" y1="446" x2="938" y2="446" stroke="#9C7A4D" stroke-width="1"/>
  <g font-size="8" fill="#A9A399">
    <text x="578" y="462">avant</text>
    <rect x="612" y="455" width="93" height="9" fill="#6b6155"/><rect x="705" y="455" width="73" height="9" fill="#7a6f5f"/><rect x="778" y="455" width="73" height="9" fill="#8a7d68"/><rect x="851" y="455" width="83" height="9" fill="#9C7A4D" opacity="0.5"/>
    <text x="578" y="480">après</text>
    <rect x="612" y="473" width="93" height="9" fill="#6b6155"/><rect x="705" y="473" width="62" height="9" fill="#7a6f5f"/><rect x="767" y="473" width="62" height="9" fill="#8a7d68"/><rect x="829" y="473" width="105" height="9" fill="#9C7A4D"/>
  </g>
  <text x="612" y="496" fill="#EDE9E3" font-size="8">Sols 1.80 · Moulures 1.20 · Mosaïques 1.20 · Papiers peints / M. Drapée 2.00</text>

  <text x="28" y="636" fill="#999" font-size="9">DARTANK · Maison Drapée — Détail montant à crémaillère &amp; formats — itération 1 bis</text>
</svg>
